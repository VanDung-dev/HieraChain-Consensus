[package]
name = "hierachain-consensus"
version = "0.0.0-dev6"
edition = "2021"
authors = ["Nguyễn Lê Văn Dũng <dungnguyen2661@gmail.com>"]
description = "HieraChain Consensus is a Rust-based blockchain consensus library."
readme = "README.md"
repository = "https://github.com/VanDung-dev/HieraChain-Consensus"
license = "Apache-2.0 OR MIT"

[lib]
name = "hierachain_consensus"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0.0", features = ["derive"] }
serde_json = "1.0.0"
sha2 = "0.10.0"
pyo3 = { version = "0.26.0", features = ["extension-module"] }
pythonize = "0.26.0"
crossbeam-channel = "0.5.0"
arrow = { version = "57.0.0", features = ["pyarrow"] }
tokio = { version = "1.0.0", features = ["full"] }
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
hex = "0.4.0"
thiserror = "2.0.0"
rand = "0.8.0"
uuid = { version = "1.19.0", features = ["v4"] }
regex = "1.12.0"
log = "0.4.0"

[package.metadata.maturin]
name = "hierachain_consensus"
