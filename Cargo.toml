[package]
name = "hierachain-consensus"
version = "0.0.1-dev2"
edition = "2021"
authors = ["Nguyễn Lê Văn Dũng <dungnguyen2661@gmail.com>"]
description = "HieraChain Consensus is a Rust-based blockchain consensus library."
readme = "README.md"
repository = "https://github.com/VanDung-dev/HieraChain-Consensus"
license = "Apache-2.0 OR MIT"

[lib]
name = "hierachain_consensus"
path = "hierachain-consensus/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Serialization & Data Handling
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bincode = "1.3.3"
arrow = { version = "57.2.0", features = ["pyarrow"] }

# Python Integration (FFI)
pyo3 = { version = "0.26.0", features = ["extension-module"] }
pythonize = "0.26.0"

# Async & Runtime
tokio = { version = "1.49.0", features = ["full"] }
dashmap = "6.1.0"
crossbeam-channel = "0.5.15"

# Client SDK
reqwest = { version = "0.12.28", features = ["json"] }
backoff = { version = "0.4.0", features = ["tokio"] }
tracing = "0.1.40"

# Cryptography & Security
sha2 = "0.10.9"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
hex = "0.4.3"
rand = "0.8.5"

# Zero Knowledge Proofs (ZKP)
ark-bn254 = "0.5.0"
ark-groth16 = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
ark-snark = "0.5.1"

# Utilities & Error Handling
thiserror = "2.0.18"
uuid = { version = "1.19.0", features = ["v4"] }
regex = "1.12.2"
log = "0.4.29"
sysinfo = { version = "0.37.2", optional = true }

[features]
default = []
resource-monitoring = ["sysinfo"]

[dev-dependencies]
tempfile = "3.24.0"

[package.metadata.maturin]
name = "hierachain_consensus"
